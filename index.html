<script>
    (async () => {
        try {
            const response = await fetch("https://cdn.jsdelivr.net/gh/martinmmcyt/rocket-goal@main/game.html");
            if (!response.ok) throw new Error(`Game page request failed: ${response.status}`);

            const html = await response.text();
            document.open();
            document.write(html);
            document.close();
        } catch (error) {
            console.error("Unable to load RocketGoal:", error);
            document.body.textContent = "RocketGoal could not be loaded. Please refresh to try again.";
        }
    })();
</script>
